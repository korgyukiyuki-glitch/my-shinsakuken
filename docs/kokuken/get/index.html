<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>口腔機能管理くんのダウンロード</title>
  <script>
    (function () {
      var m = /[?&]c=([a-z0-9_]{1,30})(?:&|$)/.exec(location.search);
      var c = 'guide_' + (m ? m[1] : 'qr');
      var ua = navigator.userAgent || '';
      var url = /Android/i.test(ua)
        ? 'https://play.google.com/store/apps/details?id=com.oralcarepro.app&utm_source=' + c + '&utm_medium=qr&utm_campaign=guide'
        : 'https://apps.apple.com/jp/app/id6760281631?pt=128621702&ct=' + c + '&mt=8';
      location.replace(url);
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #FAF8F3; color: #2B2A27; margin: 0; padding: 48px 16px; text-align: center; line-height: 1.8; }
    a { display: inline-block; margin: 8px; padding: 12px 24px; border-radius: 999px; background: #2B2A27; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <p>ストアのページを開いています。開かない場合は、お使いの端末のボタンを押してください。</p>
  <a href="https://apps.apple.com/jp/app/id6760281631?pt=128621702&amp;ct=guide_qr&amp;mt=8">App Store（iPhone・iPad）</a>
  <a href="https://play.google.com/store/apps/details?id=com.oralcarepro.app&amp;utm_source=guide_qr&amp;utm_medium=qr&amp;utm_campaign=guide">Google Play（Android）</a>
</body>
</html>
